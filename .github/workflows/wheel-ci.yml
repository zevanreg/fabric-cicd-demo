name: Wheel offline CI
on:
  push:
    branches: [dev]
    paths:
      - 'src/wheel-workloads/**'
      - '.github/workflows/wheel-*.yml'
  pull_request:
    paths:
      - 'src/wheel-workloads/**'
      - '.github/workflows/wheel-*.yml'
permissions:
  contents: read
defaults:
  run:
    working-directory: src/wheel-workloads
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/wheel-workloads/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
