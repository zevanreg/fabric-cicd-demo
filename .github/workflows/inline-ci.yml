name: Inline offline CI
on:
  push:
    branches: [feature/**]
    paths:
      - 'src/inline-workloads/**'
      - '.github/workflows/inline-*.yml'
  pull_request:
    paths:
      - 'src/inline-workloads/**'
      - '.github/workflows/inline-*.yml'
permissions:
  contents: read
defaults:
  run:
    working-directory: src/inline-workloads
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/inline-workloads/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
